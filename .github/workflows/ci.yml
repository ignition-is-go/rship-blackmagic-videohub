name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Run CI 
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

    steps:
    - uses: actions/checkout@v4
    - uses: ignition-is-go/pulse-actions/actions/report-resources@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
    - uses: ignition-is-go/pulse-actions/actions/setup-rust@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
      with:
        components: rustfmt, clippy
        compiler-cache-endpoint: ${{ secrets.CI_CACHE_ENDPOINT }}
        compiler-cache-bucket: ${{ secrets.CI_CACHE_BUCKET }}
        compiler-cache-access-key: ${{ secrets.CI_CACHE_ACCESS_KEY }}
        compiler-cache-secret-key: ${{ secrets.CI_CACHE_SECRET_KEY }}
    
    - name: Check formatting
      run: cargo fmt --all -- --check
      
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings -A unused-variables -A dead-code
      
    - name: Run tests
      run: cargo test --verbose
      
    - name: Build release
      run: cargo build --verbose --release

    - name: Build docker
      run: docker build -t ghcr.io/ignition-is-go/rship-blackmagic-videohub:latest .

    - name: Login docker
      run: echo $GITHUB_TOKEN | docker login ghcr.io -u workflow --password-stdin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish docker
      run: docker push ghcr.io/ignition-is-go/rship-blackmagic-videohub:latest
    - uses: ignition-is-go/pulse-actions/actions/report-resources@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
      if: always()
